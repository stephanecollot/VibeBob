name: Submit a mod
description: Publish a mod to the VibeBob marketplace
title: "[mod] "
labels: ["mod-submission"]
body:
  - type: markdown
    attributes:
      value: |
        VibeBob fills this in for you: side panel → your mod → **dev** → **Publish to marketplace**.
        Filling it in by hand works too, but the payload has to come from that button.

        Your mod is published under your GitHub username, and the code runs with full access
        to the pages it matches — so publish only what you would install yourself.
  - type: input
    id: mod-name
    attributes:
      label: Mod name
      placeholder: Hide YouTube Shorts
    validations:
      required: true
  - type: input
    id: mod-slug
    attributes:
      label: Slug
      description: lowercase-with-dashes, unique within your username
      placeholder: hide-youtube-shorts
    validations:
      required: true
  - type: textarea
    id: mod-description
    attributes:
      label: What it does
      placeholder: Removes Shorts from the sidebar, home feed, and search results.
    validations:
      required: true
  - type: textarea
    id: mod-matches
    attributes:
      label: Sites it runs on
      description: One JavaScript regex per line, matched against the full URL.
      render: text
    validations:
      required: true
  - type: textarea
    id: payload
    attributes:
      label: Bundle payload
      description: Generated by VibeBob. Don't edit it — the checks read this, not the fields above.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Declarations
      options:
        - label: I wrote this mod, or I have the right to publish it, and I license it under MIT.
          required: true
        - label: It does not collect or transmit anyone's data.
          required: true
